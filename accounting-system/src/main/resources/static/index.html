<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人收支记账系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background: #ff3344;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.3s;
        }

        .record-item:hover {
            background: #f8f9fa;
        }

        .record-info {
            flex: 1;
        }

        .record-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 10px;
        }

        .record-category.income {
            background: #d4edda;
            color: #155724;
        }

        .record-category.expense {
            background: #f8d7da;
            color: #721c24;
        }

        .record-amount {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .record-amount.income {
            color: #28a745;
        }

        .record-amount.expense {
            color: #dc3545;
        }

        .record-time {
            color: #999;
            font-size: 12px;
        }

        .record-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card.expense {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
        }

        .stat-card.income {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        }

        .stat-card.balance {
            background: linear-gradient(135deg, #339af0 0%, #228be6 100%);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .category-stats {
            margin-top: 20px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .category-bar {
            flex: 1;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            margin: 0 16px;
            overflow: hidden;
        }

        .category-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-name {
            font-weight: bold;
            color: #333;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 16px;
            }

            .record-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .record-actions {
                margin-top: 10px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>个人收支记账系统</h1>
            <p>轻松管理您的财务</p>
        </div>

        <!-- 登录/注册区域 -->
        <div id="authSection" class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchAuthTab('login')">登录</button>
                <button class="tab" onclick="switchAuthTab('register')">注册</button>
            </div>

            <!-- 登录表单 -->
            <div id="loginForm" class="tab-content active">
                <div class="form-group">
                    <label>手机号/邮箱</label>
                    <input type="text" id="loginUsername" placeholder="请输入手机号或邮箱">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>
                <button class="btn btn-primary" onclick="login()" style="width: 100%;">登录</button>
            </div>

            <!-- 注册表单 -->
            <div id="registerForm" class="tab-content">
                <div class="form-group">
                    <label>手机号/邮箱</label>
                    <input type="text" id="registerUsername" placeholder="请输入手机号或邮箱">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="registerPassword" placeholder="请输入密码（6-20位）">
                </div>
                <button class="btn btn-primary" onclick="register()" style="width: 100%;">注册</button>
            </div>
        </div>

        <!-- 主应用区域 -->
        <div id="appSection" style="display: none;">
            <!-- 用户信息 -->
            <div class="card">
                <div class="user-info">
                    <span class="user-name">欢迎，<span id="currentUsername"></span></span>
                    <div class="btn-group">
                        <button class="btn btn-secondary btn-small" onclick="showChangePassword()">修改密码</button>
                        <button class="btn btn-danger btn-small" onclick="logout()">退出</button>
                    </div>
                </div>
            </div>

            <!-- 功能标签页 -->
            <div class="card">
                <div class="tabs">
                    <button class="tab active" onclick="switchMainTab('add')">记一笔</button>
                    <button class="tab" onclick="switchMainTab('list')">收支明细</button>
                    <button class="tab" onclick="switchMainTab('stats')">统计分析</button>
                </div>

                <!-- 记一笔 -->
                <div id="addTab" class="tab-content active">
                    <div class="form-group">
                        <label>类型</label>
                        <select id="recordType">
                            <option value="EXPENSE">支出</option>
                            <option value="INCOME">收入</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>金额</label>
                        <input type="number" id="recordAmount" placeholder="请输入金额" step="0.01" min="0.01">
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="recordCategory">
                            <option value="餐饮">餐饮</option>
                            <option value="购物">购物</option>
                            <option value="交通">交通</option>
                            <option value="娱乐">娱乐</option>
                            <option value="医疗">医疗</option>
                            <option value="教育">教育</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <input type="text" id="recordRemark" placeholder="请输入备注（可选）">
                    </div>
                    <button class="btn btn-primary" onclick="addRecord()" style="width: 100%;">保存</button>
                </div>

                <!-- 收支明细 -->
                <div id="listTab" class="tab-content">
                    <div class="form-group">
                        <label>筛选条件</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input type="date" id="filterStartDate" placeholder="开始日期">
                            <input type="date" id="filterEndDate" placeholder="结束日期">
                        </div>
                    </div>
                    <div class="form-group">
                        <select id="filterType">
                            <option value="">全部类型</option>
                            <option value="INCOME">收入</option>
                            <option value="EXPENSE">支出</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select id="filterCategory">
                            <option value="">全部分类</option>
                            <option value="餐饮">餐饮</option>
                            <option value="薪资">薪资</option>
                            <option value="购物">购物</option>
                            <option value="交通">交通</option>
                            <option value="娱乐">娱乐</option>
                            <option value="医疗">医疗</option>
                            <option value="教育">教育</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="queryRecords()" style="width: 100%; margin-bottom: 20px;">查询</button>

                    <div id="recordList"></div>
                    <div id="pagination" class="pagination"></div>
                </div>

                <!-- 统计分析 -->
                <div id="statsTab" class="tab-content">
                    <div class="form-group">
                        <label>统计类型</label>
                        <select id="statsType" onchange="switchStatsType()">
                            <option value="week">本周统计</option>
                            <option value="month">本月统计</option>
                        </select>
                    </div>
                    <div class="form-group" id="statsDateGroup">
                        <label>选择日期</label>
                        <input type="date" id="statsDate">
                    </div>
                    <button class="btn btn-primary" onclick="loadStatistics()" style="width: 100%; margin-bottom: 20px;">查看统计</button>

                    <div id="statisticsResult"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div id="passwordModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="card" style="max-width: 400px; width: 90%;">
            <h3 class="card-title">修改密码</h3>
            <div class="form-group">
                <label>旧密码</label>
                <input type="password" id="oldPassword" placeholder="请输入旧密码">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPassword" placeholder="请输入新密码（6-20位）">
            </div>
            <div class="btn-group" style="justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
                <button class="btn btn-primary" onclick="changePassword()">确认</button>
            </div>
        </div>
    </div>

    <!-- 编辑记录弹窗 -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="card" style="max-width: 400px; width: 90%;">
            <h3 class="card-title">编辑记录</h3>
            <input type="hidden" id="editRecordId">
            <div class="form-group">
                <label>类型</label>
                <select id="editRecordType">
                    <option value="EXPENSE">支出</option>
                    <option value="INCOME">收入</option>
                </select>
            </div>
            <div class="form-group">
                <label>金额</label>
                <input type="number" id="editRecordAmount" step="0.01" min="0.01">
            </div>
            <div class="form-group">
                <label>分类</label>
                <select id="editRecordCategory">
                    <option value="餐饮">餐饮</option>
                    <option value="薪资">薪资</option>
                    <option value="购物">购物</option>
                    <option value="交通">交通</option>
                    <option value="娱乐">娱乐</option>
                    <option value="医疗">医疗</option>
                    <option value="教育">教育</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" id="editRecordRemark">
            </div>
            <div class="btn-group" style="justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary" onclick="updateRecord()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // API基础URL
        const API_BASE = 'http://localhost:8080/api';

        // 当前页码
        let currentPage = 1;
        let totalPages = 1;

        // 切换登录/注册标签
        function switchAuthTab(tab) {
            document.querySelectorAll('#authSection .tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#authSection .tab-content').forEach(t => t.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');
        }

        // 切换主标签
        function switchMainTab(tab) {
            document.querySelectorAll('#appSection .tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#appSection .tab-content').forEach(t => t.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');

            if (tab === 'list') {
                queryRecords();
            } else if (tab === 'stats') {
                loadStatistics();
            }
        }

        // 切换统计类型
        function switchStatsType() {
            const type = document.getElementById('statsType').value;
            const dateGroup = document.getElementById('statsDateGroup');
            const dateInput = document.getElementById('statsDate');

            if (type === 'month') {
                dateInput.type = 'month';
            } else {
                dateInput.type = 'date';
            }
        }

        // 显示消息
        function showMessage(message, type = 'success') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = message;
            document.querySelector('.container').insertBefore(div, document.querySelector('.container').children[1]);
            setTimeout(() => div.remove(), 3000);
        }

        // 注册
        async function register() {
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;

            if (!username || !password) {
                showMessage('请填写完整信息', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/user/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.code === 200) {
                    showMessage('注册成功，请登录');
                    switchAuthTab('login');
                    document.getElementById('loginUsername').value = username;
                } else {
                    showMessage(result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            }
        }

        // 登录
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showMessage('请填写完整信息', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/user/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.code === 200) {
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('username', result.data.username);
                    showMainApp();
                    showMessage('登录成功');
                } else {
                    showMessage(result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            }
        }

        // 显示主应用
        function showMainApp() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('currentUsername').textContent = localStorage.getItem('username');
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
            showMessage('已退出登录');
        }

        // 显示修改密码弹窗
        function showChangePassword() {
            document.getElementById('passwordModal').style.display = 'flex';
        }

        // 关闭修改密码弹窗
        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
        }

        // 修改密码
        async function changePassword() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;

            if (!oldPassword || !newPassword) {
                showMessage('请填写完整信息', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/user/update-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                const result = await response.json();

                if (result.code === 200) {
                    showMessage('密码修改成功');
                    closePasswordModal();
                } else {
                    showMessage(result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            }
        }

        // 添加记录
        async function addRecord() {
            const type = document.getElementById('recordType').value;
            const amount = parseFloat(document.getElementById('recordAmount').value);
            const category = document.getElementById('recordCategory').value;
            const remark = document.getElementById('recordRemark').value;

            if (!amount || amount <= 0) {
                showMessage('请输入有效的金额', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/record/add`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({ type, amount, category, remark })
                });

                const result = await response.json();

                if (result.code === 200) {
                    showMessage('记录添加成功');
                    document.getElementById('recordAmount').value = '';
                    document.getElementById('recordRemark').value = '';
                } else {
                    showMessage(result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            }
        }

        // 查询记录
        async function queryRecords(pageNum = 1) {
            const startTime = document.getElementById('filterStartDate').value;
            const endTime = document.getElementById('filterEndDate').value;
            const type = document.getElementById('filterType').value;
            const category = document.getElementById('filterCategory').value;

            try {
                const response = await fetch(`${API_BASE}/record/list`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({
                        startTime,
                        endTime,
                        type,
                        category,
                        pageNum,
                        pageSize: 10
                    })
                });

                const result = await response.json();

                if (result.code === 200) {
                    renderRecordList(result.data);
                    currentPage = result.data.pageNum;
                    totalPages = result.data.totalPages;
                    renderPagination();
                } else {
                    showMessage(result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            }
        }

        // 渲染记录列表
        function renderRecordList(data) {
            const container = document.getElementById('recordList');

            if (!data.list || data.list.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无记录</div>';
                return;
            }

            container.innerHTML = data.list.map(record => `
                <div class="record-item">
                    <div class="record-info">
                        <div style="margin-bottom: 5px;">
                            <span class="record-category ${record.type === 'INCOME' ? 'income' : 'expense'}">
                                ${record.type === 'INCOME' ? '收入' : '支出'}
                            </span>
                            <span>${record.category}</span>
                        </div>
                        <div class="record-amount ${record.type === 'INCOME' ? 'income' : 'expense'}">
                            ${record.type === 'INCOME' ? '+' : '-'}¥${record.amount.toFixed(2)}
                        </div>
                        <div class="record-time">${record.createTime}</div>
                        ${record.remark ? `<div style="color: #666; font-size: 12px; margin-top: 5px;">备注：${record.remark}</div>` : ''}
                    </div>
                    <div class="record-actions">
                        <button class="btn btn-secondary btn-small" onclick="showEditModal(${record.id}, '${record.type}', ${record.amount}, '${record.category}', '${record.remark || ''}')">编辑</button>
                        <button class="btn btn-danger btn-small" onclick="deleteRecord(${record.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 渲染分页
        function renderPagination() {
            const container = document.getElementById('pagination');
            let html = '';

            html += `<button class="page-btn" onclick="queryRecords(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>`;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="queryRecords(${i})">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<span>...</span>`;
                }
            }

            html += `<button class="page-btn" onclick="queryRecords(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>`;

            container.innerHTML = html;
        }

        // 显示编辑弹窗
        function showEditModal(id, type, amount, category, remark) {
            document.getElementById('editRecordId').value = id;
            document.getElementById('editRecordType').value = type;
            document.getElementById('editRecordAmount').value = amount;
            document.getElementById('editRecordCategory').value = category;
            document.getElementById('editRecordRemark').value = remark;
            document.getElementById('editModal').style.display = 'flex';
        }

        // 关闭编辑弹窗
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // 更新记录
        async function updateRecord() {
            const id = document.getElementById('editRecordId').value;
            const type = document.getElementById('editRecordType').value;
            const amount = parseFloat(document.getElementById('editRecordAmount').value);
            const category = document.getElementById('editRecordCategory').value;
            const remark = document.getElementById('editRecordRemark').value;

            if (!amount || amount <= 0) {
                showMessage('请输入有效的金额', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/record/update`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({ id: parseInt(id), type, amount, category, remark })
                });

                const result = await response.json();

                if (result.code === 200) {
                    showMessage('记录更新成功');
                    closeEditModal();
                    queryRecords(currentPage);
                } else {
                    showMessage(result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            }
        }

        // 删除记录
        async function deleteRecord(id) {
            if (!confirm('确定要删除这条记录吗？')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/record/delete/${id}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                });

                const result = await response.json();

                if (result.code === 200) {
                    showMessage('记录删除成功');
                    queryRecords(currentPage);
                } else {
                    showMessage(result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            }
        }

        // 加载统计数据
        async function loadStatistics() {
            const type = document.getElementById('statsType').value;
            const date = document.getElementById('statsDate').value;

            const url = type === 'week'
                ? `${API_BASE}/statistics/week`
                : `${API_BASE}/statistics/month`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({ date })
                });

                const result = await response.json();

                if (result.code === 200) {
                    renderStatistics(result.data);
                } else {
                    showMessage(result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            }
        }

        // 渲染统计数据
        function renderStatistics(data) {
            const container = document.getElementById('statisticsResult');

            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#43e97b', '#fa709a'];

            let incomeHtml = '';
            let expenseHtml = '';

            if (data.incomeByCategory && Object.keys(data.incomeByCategory).length > 0) {
                incomeHtml = Object.entries(data.incomeByCategory).map(([category, info], index) => `
                    <div class="category-item">
                        <span>${category}</span>
                        <div class="category-bar">
                            <div class="category-bar-fill" style="width: ${info.percent}%; background: ${colors[index % colors.length]};"></div>
                        </div>
                        <span>¥${info.amount.toFixed(2)} (${info.percent}%)</span>
                    </div>
                `).join('');
            }

            if (data.expenseByCategory && Object.keys(data.expenseByCategory).length > 0) {
                expenseHtml = Object.entries(data.expenseByCategory).map(([category, info], index) => `
                    <div class="category-item">
                        <span>${category}</span>
                        <div class="category-bar">
                            <div class="category-bar-fill" style="width: ${info.percent}%; background: ${colors[index % colors.length]};"></div>
                        </div>
                        <span>¥${info.amount.toFixed(2)} (${info.percent}%)</span>
                    </div>
                `).join('');
            }

            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card income">
                        <div class="stat-value">¥${data.totalIncome.toFixed(2)}</div>
                        <div class="stat-label">总收入</div>
                    </div>
                    <div class="stat-card expense">
                        <div class="stat-value">¥${data.totalExpense.toFixed(2)}</div>
                        <div class="stat-label">总支出</div>
                    </div>
                    <div class="stat-card balance">
                        <div class="stat-value">¥${data.balance.toFixed(2)}</div>
                        <div class="stat-label">结余</div>
                    </div>
                </div>

                <div style="color: #666; text-align: center; margin-bottom: 20px;">
                    统计周期：${data.startDate} 至 ${data.endDate}
                </div>

                ${incomeHtml ? `
                    <div class="category-stats">
                        <h4 style="margin-bottom: 15px; color: #28a745;">收入分类占比</h4>
                        ${incomeHtml}
                    </div>
                ` : ''}

                ${expenseHtml ? `
                    <div class="category-stats">
                        <h4 style="margin-bottom: 15px; color: #dc3545;">支出分类占比</h4>
                        ${expenseHtml}
                    </div>
                ` : ''}

                ${!incomeHtml && !expenseHtml ? '<div class="empty-state">该时间段暂无记录</div>' : ''}
            `;
        }

        // 页面加载时检查登录状态
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (token) {
                showMainApp();
            }

            // 设置默认日期
            document.getElementById('statsDate').value = new Date().toISOString().split('T')[0];
        };
    </script>
</body>
</html>
